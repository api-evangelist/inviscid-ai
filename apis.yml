name: Inviscid AI
description: >-
  Inviscid AI is a San Francisco-based startup (Y Combinator W2026) building
  physics-informed AI for real-time cooling and airflow simulation of buildings
  and industrial facilities. Its platform combines computational fluid dynamics
  (CFD) with physics-informed neural networks to run thermal digital twins up to
  1000x faster than traditional CFD, ingesting live data from building management
  systems, meters, and IoT sensors to autonomously recommend HVAC setpoints and
  optimize airflow. Target facilities include data centers, offices, hospitals,
  and cold storage, where the company claims 30%+ energy savings and sub-90-day
  ROI. As of mid-2026 Inviscid AI is a pre-product-launch company with no public
  developer portal, API, SDKs, or OpenAPI surface; this profile tracks it as an
  API Evangelist network lead pending an external API.
